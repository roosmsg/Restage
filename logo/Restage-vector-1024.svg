  <linearGradient id="green-lower" x1="0%" y1="100%" x2="100%" y2="0%"><stop offset="0" stop-color="#04ddf9"/><stop offset="0.38" stop-color="#05bccc"/><stop offset="0.7" stop-color="#08c9aa"/><stop offset="1" stop-color="#0af49d"/></linearGradient>
  <linearGradient id="shadow" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0" stop-color="#04184a" stop-opacity="0.26"/><stop offset="1" stop-color="#05164a" stop-opacity="0"/></linearGradient>
  <clipPath id="card"><path d="M711 532 Q711 501 738 489 L975 367 Q997 358 1014 374 Q1030 389 1030 411 L1030 639 Q1030 667 1007 679 L745 802 Q711 819 711 784 Z"/></clipPath>
