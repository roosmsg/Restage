  <linearGradient id="left" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0" stop-color="#592cf6"/><stop offset="1" stop-color="#3b17e3"/></linearGradient>
  <linearGradient id="side" x1="20%" y1="15%" x2="80%" y2="100%"><stop offset="0" stop-color="#471cf0"/><stop offset="0.75" stop-color="#4116da"/><stop offset="1" stop-color="#1265dd"/></linearGradient>
  <linearGradient id="base" x1="0%" y1="0%" x2="100%" y2="85%"><stop offset="0" stop-color="#7a40fd"/><stop offset="0.42" stop-color="#5927f9"/><stop offset="1" stop-color="#4217dc"/></linearGradient>
