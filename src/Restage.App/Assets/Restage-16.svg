<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- 16 px: every edge on a 16-unit grid so the panes land on whole pixels. -->
  <rect x="8" y="8" width="240" height="240" rx="48" fill="#4B3DFF"/>
  <rect x="48" y="56" width="80" height="144" rx="8" fill="#FFFFFF"/>
  <rect x="144" y="56" width="64" height="64" rx="8" fill="#FFFFFF"/>
  <rect x="144" y="136" width="64" height="64" rx="8" fill="#FFFFFF"/>
</svg>
