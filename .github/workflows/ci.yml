name: CI

on:
  push:
    branches: [main, local-trunk]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build
        run: dotnet build Restage.slnx -c Release
      - name: Test
        run: dotnet test tests/Restage.Core.Tests/Restage.Core.Tests.csproj -c Release --no-build
